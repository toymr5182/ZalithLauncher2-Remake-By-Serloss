name: Build FCL RADV Xclipse Plugin

on:
  push:
    paths:
      - "FCLRadDriverPlugin/**"
      - ".github/workflows/build-radv-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Fetch RADV Xclipse 540
        run: |
          chmod +x FCLRadDriverPlugin/scripts/fetch-radv.sh
          FCLRadDriverPlugin/scripts/fetch-radv.sh

      - name: Build plugin APK
        working-directory: FCLRadDriverPlugin
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: radv-xclipse-540-fcl-driver
          path: FCLRadDriverPlugin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
