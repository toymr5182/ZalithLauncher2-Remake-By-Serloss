name: Release APK (arm64)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-arm64:
    runs-on: ubuntu-latest

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "Using NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      # 仓库未配置签名密钥时，用一次性生成的密钥签名，保证产物是可安装的 release 包
      - name: Prepare release signing
        run: |
          if [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Using repository signing secrets."
            exit 0
          fi

          pass="Zl$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)9x"
          {
            echo "STORE_PASSWORD=$pass"
            echo "KEY_PASSWORD=$pass"
          } >> "$GITHUB_ENV"

          rm -f ZalithLauncher/zalith_launcher.jks
          keytool -genkeypair -v \
            -keystore ZalithLauncher/zalith_launcher.jks \
            -alias movtery_zalith \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$pass" -keypass "$pass" \
            -dname "CN=Zalith Launcher CI, OU=CI, O=CI, L=CI, ST=CI, C=TH" >/dev/null
          echo "Generated a CI signing key because STORE_PASSWORD/KEY_PASSWORD are not configured."

      - name: Build release APK (arm64)
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=arm64

      - name: Upload release APK (arm64)
        uses: actions/upload-artifact@v7
        with:
          name: release apk (arm64 signed)
          path: |
            ZalithLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release mapping (arm64)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping (arm64)
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt
