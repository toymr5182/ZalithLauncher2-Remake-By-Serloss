name: Release APK (arm64)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-arm64:
    runs-on: ubuntu-latest

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "Using NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      # 仓库未配置签名密钥时，改用仓库内置的 debug 密钥签名
      # 固定使用同一把密钥，保证每次构建的 APK 签名一致，可以直接覆盖安装升级
      - name: Prepare release signing
        run: |
          if [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Using repository signing secrets."
            exit 0
          fi

          debug_store=$(grep -m1 '^default_store_password=' ZalithLauncher/gradle.properties | cut -d= -f2-)
          debug_key=$(grep -m1 '^default_key_password=' ZalithLauncher/gradle.properties | cut -d= -f2-)
          if [ -z "$debug_store" ] || [ -z "$debug_key" ]; then
            echo "No signing secrets and no bundled debug keystore password." >&2
            exit 1
          fi

          rm -f ZalithLauncher/zalith_launcher.jks
          keytool -importkeystore -noprompt \
            -srckeystore ZalithLauncher/zalith_launcher_debug.jks \
            -srcstorepass "$debug_store" \
            -srcalias movtery_zalith_debug \
            -destkeystore ZalithLauncher/zalith_launcher.jks \
            -deststorepass "$debug_store" \
            -destkeypass "$debug_key" \
            -destalias movtery_zalith >/dev/null

          {
            echo "STORE_PASSWORD=$debug_store"
            echo "KEY_PASSWORD=$debug_key"
          } >> "$GITHUB_ENV"
          echo "Signed with the bundled debug key (repository signing secrets are not configured)."

      - name: Build release APK (arm64)
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=arm64

      - name: Upload release APK (arm64)
        uses: actions/upload-artifact@v7
        with:
          name: release apk (arm64 signed)
          path: |
            ZalithLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release mapping (arm64)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping (arm64)
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt
