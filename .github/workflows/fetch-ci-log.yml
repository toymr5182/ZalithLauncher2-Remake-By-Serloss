name: Fetch CI failure log

on:
  workflow_run:
    workflows: ["Build CI"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  fetch:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Copy failed log to branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .ci
          gh run view "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" --log > .ci/failure.log || true
          tail -n 400 .ci/failure.log > .ci/failure-tail.log
          printf 'run=%s\nsha=%s\n' \
            "${{ github.event.workflow_run.id }}" \
            "${{ github.event.workflow_run.head_sha }}" > .ci/meta.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "ci-log/${{ github.event.workflow_run.id }}"
          git add .ci/failure-tail.log .ci/meta.txt
          git commit -m "ci: failure log ${{ github.event.workflow_run.id }}" || true
          git push origin "HEAD:ci-log/${{ github.event.workflow_run.id }}" --force
